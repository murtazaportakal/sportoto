name: Spor Toto Auto-Sync

on:
  schedule:
    # Runs at 02:00 UTC daily (~05:00 AM TR time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Auto Sync & Model Tuning
        run: node auto_sync.js

      - name: Commit and push updated data if changes exist
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Auto-Sync]"
          git add -A
          if git diff --staged --quiet; then
            echo "No data changes found. Skipping commit."
          else
            git commit -m "chore(sync): automated nightly sportoto sync [skip ci]"
            git push
          fi
